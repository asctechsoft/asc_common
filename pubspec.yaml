name: asc_common
description: "Shared internal Flutter package của ASC Tech Soft - UI primitives, ads, GDPR, Firebase utils, localization... dùng chung cho nhiều app."
version: 0.0.1
homepage: https://github.com/asctechsoft/asc_common
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: ">=1.17.0"

dependencies:
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  google_mobile_ads: ^9.1.0
  in_app_review: ^2.0.12
  logger: ^2.8.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  # Khoảng rộng cố ý: package dùng chung nhiều app, app nào đã có `excel`
  # (kéo theo xml <7.0.0) vẫn resolve được - đừng ghim `^7.x` hẹp lại.
  xml: '>=6.0.0 <8.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
